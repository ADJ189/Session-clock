<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260">
  <defs>
    <radialGradient id="bg" cx="30%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#0d0a1c"/>
      <stop offset="55%" stop-color="#07040f"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <filter id="markGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="sep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6ee7b7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="260" rx="16"/></clipPath>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>

  <!-- Stars -->
  <g clip-path="url(#c)" opacity="0.5">
    <circle cx="30" cy="20" r="0.9" fill="#fff" opacity="0.6"/>
    <circle cx="120" cy="230" r="0.7" fill="#fff" opacity="0.5"/>
    <circle cx="860" cy="22" r="0.9" fill="#fff" opacity="0.5"/>
    <circle cx="875" cy="238" r="0.7" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Logo mark (isolated left column, x: 40–188) -->
  <g transform="translate(44, 50) scale(0.68)">
    <g fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M 183.37 110.24 A 84 84 0 0 1 110.24 183.37" stroke="#6ee7b7"/>
      <path d="M 89.76 183.37 A 84 84 0 0 1 16.63 110.24" stroke="#6ee7b7"/>
      <path d="M 16.63 89.76 A 84 84 0 0 1 89.76 16.63" stroke="#6ee7b7"/>
      <path d="M 110.24 16.63 A 84 84 0 0 1 183.37 89.76" stroke="#c8fbe9" filter="url(#markGlow)"/>
    </g>
    <path d="M 70 58 L 130 58 L 100 102 Z" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 88 88 L 112 88 L 100 106 Z" fill="#6ee7b7"/>
    <path d="M 100 102 L 136 146 L 64 146 Z" fill="#6ee7b7"/>
    <path d="M 78 132 L 92 144 L 114.9 102" fill="none" stroke="#07040f" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 114.9 102 L 128 78" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="116" y="234" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="1.5" fill="#6ee7b7" opacity="0.5">SESSION CLOCK</text>

  <!-- Right column content, x: 228–870 -->
  <text x="228" y="76" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="38" font-weight="300" letter-spacing="2" fill="#c8fbe9" filter="url(#tg)">SESSION <tspan font-weight="800" letter-spacing="0.5">CLOCK</tspan></text>

  <line x1="228" y1="96" x2="852" y2="96" stroke="url(#sep)" stroke-width="1.2"/>

  <text x="228" y="122" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="300" fill="#a5f3d0" opacity="0.8" letter-spacing="0.3">
    A cinematic focus timer. Every theme is a world.
  </text>

  <!-- Feature pills -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500">
    <rect x="228" y="138" width="90" height="24" rx="12" fill="#6ee7b7" fill-opacity="0.1" stroke="#6ee7b7" stroke-width="0.8" stroke-opacity="0.45"/>
    <text x="273" y="154" fill="#6ee7b7" text-anchor="middle">96 Themes</text>

    <rect x="326" y="138" width="90" height="24" rx="12" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="371" y="154" fill="#818cf8" text-anchor="middle">Live Mixer</text>

    <rect x="424" y="138" width="88" height="24" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="468" y="154" fill="#f87171" text-anchor="middle">Pomodoro</text>

    <rect x="520" y="138" width="112" height="24" rx="12" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="576" y="154" fill="#818cf8" text-anchor="middle">Now Playing</text>

    <rect x="640" y="138" width="88" height="24" rx="12" fill="#6ee7b7" fill-opacity="0.1" stroke="#6ee7b7" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="684" y="154" fill="#6ee7b7" text-anchor="middle">Zen Mode</text>
  </g>

  <!-- Stats -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <text x="228" y="204" font-size="26" font-weight="800" fill="#6ee7b7">96</text>
    <text x="228" y="220" font-size="10" fill="#6ee7b7" opacity="0.55">THEMES</text>

    <line x1="270" y1="186" x2="270" y2="224" stroke="#6ee7b7" stroke-width="0.8" opacity="0.2"/>

    <text x="282" y="204" font-size="26" font-weight="800" fill="#818cf8">13</text>
    <text x="282" y="220" font-size="10" fill="#818cf8" opacity="0.55">SOUNDS</text>

    <line x1="326" y1="186" x2="326" y2="224" stroke="#6ee7b7" stroke-width="0.8" opacity="0.2"/>

    <text x="338" y="204" font-size="26" font-weight="800" fill="#f87171">0</text>
    <text x="338" y="220" font-size="10" fill="#f87171" opacity="0.55">DEPS</text>

    <line x1="370" y1="186" x2="370" y2="224" stroke="#6ee7b7" stroke-width="0.8" opacity="0.2"/>

    <text x="382" y="204" font-size="26" font-weight="800" fill="#4ade80">8</text>
    <text x="382" y="220" font-size="10" fill="#4ade80" opacity="0.55">LANGUAGES</text>
  </g>

  <!-- Quote bottom-right -->
  <text x="852" y="240" font-family="Georgia, serif" text-anchor="end"
    font-size="12" fill="#6ee7b7" opacity="0.35" font-style="italic">
    "Focus is the art of knowing what to ignore."
  </text>
</svg>
