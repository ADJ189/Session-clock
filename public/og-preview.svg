<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgMain" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d0a1c"/>
      <stop offset="55%" stop-color="#07040f"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <filter id="markGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="c"><rect width="1200" height="630"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bgMain)"/>

  <!-- Stars -->
  <g clip-path="url(#c)" opacity="0.5">
    <circle cx="60" cy="40" r="1.1" fill="#fff" opacity="0.6"/>
    <circle cx="1140" cy="50" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="1100" cy="580" r="1" fill="#fff" opacity="0.4"/>
    <circle cx="80" cy="590" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="600" cy="30" r="0.9" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Logo mark, centered -->
  <g transform="translate(600, 230) scale(1.35) translate(-100, -100)">
    <g fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M 183.37 110.24 A 84 84 0 0 1 110.24 183.37" stroke="#6ee7b7"/>
      <path d="M 89.76 183.37 A 84 84 0 0 1 16.63 110.24" stroke="#6ee7b7"/>
      <path d="M 16.63 89.76 A 84 84 0 0 1 89.76 16.63" stroke="#6ee7b7"/>
      <path d="M 110.24 16.63 A 84 84 0 0 1 183.37 89.76" stroke="#c8fbe9" filter="url(#markGlow)"/>
    </g>
    <path d="M 70 58 L 130 58 L 100 102 Z" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 88 88 L 112 88 L 100 106 Z" fill="#6ee7b7"/>
    <path d="M 100 102 L 136 146 L 64 146 Z" fill="#6ee7b7"/>
    <path d="M 78 132 L 92 144 L 114.9 102" fill="none" stroke="#07040f" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 114.9 102 L 128 78" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="452" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="58" font-weight="300" letter-spacing="4" fill="#c8fbe9" filter="url(#tg)">SESSION <tspan font-weight="800" letter-spacing="1">CLOCK</tspan></text>

  <text x="600" y="500" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="19" font-weight="300" fill="#a5f3d0" opacity="0.85" letter-spacing="0.4">
    A cinematic focus timer. Every theme is a world.
  </text>

  <!-- Stats row -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="440" y="570" font-size="30" font-weight="800" fill="#6ee7b7">96</text>
    <text x="440" y="588" font-size="11" fill="#6ee7b7" opacity="0.55" letter-spacing="1">THEMES</text>

    <line x1="510" y1="548" x2="510" y2="592" stroke="#6ee7b7" stroke-width="0.8" opacity="0.2"/>

    <text x="560" y="570" font-size="30" font-weight="800" fill="#818cf8">13</text>
    <text x="560" y="588" font-size="11" fill="#818cf8" opacity="0.55" letter-spacing="1">SOUNDS</text>

    <line x1="630" y1="548" x2="630" y2="592" stroke="#6ee7b7" stroke-width="0.8" opacity="0.2"/>

    <text x="680" y="570" font-size="30" font-weight="800" fill="#f87171">0</text>
    <text x="680" y="588" font-size="11" fill="#f87171" opacity="0.55" letter-spacing="1">DEPS</text>

    <line x1="720" y1="548" x2="720" y2="592" stroke="#6ee7b7" stroke-width="0.8" opacity="0.2"/>

    <text x="770" y="570" font-size="30" font-weight="800" fill="#4ade80">8</text>
    <text x="770" y="588" font-size="11" fill="#4ade80" opacity="0.55" letter-spacing="1">LANGUAGES</text>
  </g>
</svg>
