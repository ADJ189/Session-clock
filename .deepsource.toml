version = 1

# Nothing here is source we wrote — build output, deps, and the local
# dev-only Cloudflare state directory.
exclude_patterns = [
  "dist/**",
  "node_modules/**",
  ".wrangler/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  # This is a TypeScript codebase (src/**/*.ts) plus two Cloudflare Pages
  # Functions (functions/**/*.ts) — no framework plugin needed (no React/
  # Vue/etc., just vanilla TS + Canvas).
  dialect = "typescript"

[[analyzers]]
name = "secrets"
enabled = true

# ── A note for whoever reads this next ──────────────────────────────────
# Two "hardcoded credential" findings from the secrets analyzer
# (GOOGLE_CLIENT_ID_KEY in src/integrations.ts, PRESETS_KEY in
# src/main.ts) are false positives: both are localStorage *key names*
# (e.g. 'sc_google_client_id'), not credential values — there's no
# secret in the string, just a label used to read/write localStorage.
# Dismiss those two from the DeepSource dashboard rather than renaming
# the constants to dodge the pattern match.
#
# The bulk of the JavaScript findings (JS-0067 "function declaration in
# global scope", most of the JS-C1002 "variable name too small" hits)
# are a rule/architecture mismatch rather than real issues: this project
# is "type": "module" in package.json, so every top-level function in
# every file is already module-scoped, not actually global — JS-0067's
# premise doesn't hold here. Rewriting ~90 files into IIFEs to satisfy it
# would be a large, purely cosmetic change. Recommend tuning that rule's
# severity down for this repo from the DeepSource dashboard (Settings →
# rule severity) rather than restructuring the codebase around it.
